# En-têtes de sécurité, inclus dans chaque bloc location : nginx n'hérite pas des add_header du
# niveau server dès qu'un location en déclare un.
# style-src 'unsafe-inline' : styles de composants injectés par Angular (à remplacer par ngCspNonce si possible).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
