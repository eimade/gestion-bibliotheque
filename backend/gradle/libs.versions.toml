# Versions centralisées (ADR-005). Les dépendances Spring (Web, JPA, Security, Session, Flyway,
# pilote MariaDB, Testcontainers, JUnit, AssertJ, Mockito) sont gérées par le BOM Spring Boot :
# ne pas leur fixer de version ici.
# Versions vérifiées sur Maven Central le 17/10/2026.

[versions]
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
springdoc = "2.8.17"
archunit = "1.5.1"
jacoco = "0.8.15"

[libraries]
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
