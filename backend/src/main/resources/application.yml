# Configuration commune (ARCH-socle §7.3). Aucun secret ici : uniquement des variables d'environnement.
spring:
  application:
    name: bibliotheque
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bibliotheque}
    # Utilisateur applicatif : droits SELECT/INSERT/UPDATE/DELETE uniquement (ADR-005)
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schéma géré exclusivement par Flyway (ADR-002)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 50   # collections d'une page chargées par lot (pas de N+1)
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    # Utilisateur de migration : propriétaire du schéma (DDL)
    user: ${DB_MIGRATION_USER}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    validate-on-migrate: true
  session:
    jdbc:
      initialize-schema: never    # tables SPRING_SESSION créées par V1 (ADR-004)
      table-name: SPRING_SESSION
      cleanup-cron: "0 */5 * * * *"
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework   # derrière le reverse proxy nginx
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m                      # RG-03 : déconnexion après 30 min d'inactivité
      cookie:
        name: BIBSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Propriétés applicatives (classes @ConfigurationProperties à créer : ARCH-socle §7.1)
app:
  time-zone: Europe/Paris               # NFR-11 : dates métier calculées à l'heure de Paris
  bootstrap-admin:                      # administrateur initial créé si aucun ADMIN n'existe
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    login:
      max-failed-attempts: 5            # RG-02
      lock-duration: 15m                # RG-02
    password:
      min-length: 12                    # RG-01
      history-size: 3                   # RG-01
  privacy:
    loan-history-retention: P4M         # RG-19 (D2)
    member-archive-proposal-after: P3Y  # RG-19 (D1)
  audit:
    retention: P12M                     # NFR-08
  jobs:
    zone: Europe/Paris
    overdue-loans-cron: "0 0 0 * * *"        # RG-27
    reservation-expiry-cron: "0 5 0 * * *"   # RG-33 (NFR-11 : avant 00 h 15)
    membership-expiry-cron: "0 10 0 * * *"   # RG-16
    loan-anonymization-cron: "0 0 2 * * *"   # RG-19
    audit-purge-cron: "0 0 3 * * *"          # NFR-08

logging:
  level:
    root: INFO
