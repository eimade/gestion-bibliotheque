# Profil de développement local : base exposée par docker-compose.dev.yml, frontend servi par `ng serve`
# (proxy Angular vers http://localhost:8081 : même origine, pas de CORS nécessaire).
server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        secure: false            # HTTP en local uniquement

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.bibliotheque: DEBUG
