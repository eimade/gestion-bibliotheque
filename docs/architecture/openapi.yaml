openapi: 3.1.0
info:
  title: API Bibliothèque
  version: 0.1.0
  description: |
    Contrat de l'API de l'application de gestion de bibliothèque (ADR-003).
    Ce fichier est la source de vérité. Il contient pour l'instant le socle commun
    (sécurité, erreurs, pagination) ; les chemins sont ajoutés feature par feature
    par les documents ARCH-<slug>.md.
servers:
  - url: /api/v1
    description: Même origine que le frontend (nginx relaie /api vers le backend)

security:
  - sessionCookie: []

tags:
  - name: authentification
  - name: catalogue
  - name: adherents
  - name: circulation
  - name: pilotage

paths:
  /auth/login:
    post:
      tags: [authentification]
      summary: Ouvrir une session (US-001)
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session ouverte ; cookie BIBSESSION posé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUserResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: INVALID_CREDENTIALS, ACCOUNT_LOCKED (propriété lockedUntil) ou ACCOUNT_DISABLED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [authentification]
      summary: Fermer la session (US-002)
      operationId: logout
      responses:
        '204': { description: Session invalidée }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [authentification]
      summary: Lire la session courante
      operationId: currentSession
      responses:
        '200':
          description: Utilisateur connecté
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionUserResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/password:
    post:
      tags: [authentification]
      summary: Changer son mot de passe (US-003, RG-01, RG-05)
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Mot de passe changé ; il n'est plus temporaire }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422':
          description: CURRENT_PASSWORD_INCORRECT, PASSWORD_POLICY_VIOLATION ou PASSWORD_RECENTLY_USED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /staff-accounts:
    get:
      tags: [authentification]
      summary: Lister les comptes du personnel (US-004, US-005) — ADMIN
      operationId: listStaffAccounts
      parameters:
        - name: q
          in: query
          description: Nom, prénom ou e-mail (au moins 2 caractères)
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: role
          in: query
          schema: { type: string, enum: [LIBRARIAN, ADMIN] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AccountStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: "lastName (défaut), role ou status, suivi de ,asc ou ,desc"
          schema: { type: string, pattern: '^(lastName|role|status),(asc|desc)$', default: 'lastName,asc' }
      responses:
        '200':
          description: Page de comptes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [authentification]
      summary: Créer un compte du personnel (US-004) — ADMIN
      operationId: createStaffAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffAccountRequest' }
      responses:
        '201':
          description: Compte créé au statut ACTIVE avec mot de passe temporaire
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /staff-accounts/{id}:
    get:
      tags: [authentification]
      summary: Lire un compte du personnel (cible de Location) — ADMIN
      operationId: getStaffAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Compte du personnel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /staff-accounts/{id}/deactivation:
    post:
      tags: [authentification]
      summary: Désactiver un compte du personnel (US-005, RG-06) — ADMIN
      operationId: deactivateStaffAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Compte désactivé ; ses sessions sont supprimées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /staff-accounts/{id}/reactivation:
    post:
      tags: [authentification]
      summary: Réactiver un compte du personnel (US-005) — ADMIN
      operationId: reactivateStaffAccount
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Compte réactivé, compteur d'échecs remis à 0
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccountResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /accounts/{id}/password-reset:
    post:
      tags: [authentification]
      summary: Attribuer un mot de passe temporaire (US-006) — LIBRARIAN (comptes MEMBER), ADMIN
      operationId: resetAccountPassword
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '204': { description: "Mot de passe temporaire attribué, compte débloqué, sessions supprimées" }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /catalog/books:
    get:
      tags: [catalogue]
      summary: Rechercher dans le catalogue public (US-007, RG-11)
      operationId: searchCatalog
      security: []
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CategoryFilter'
        - name: language
          in: query
          schema: { type: string, pattern: '^[a-z]{3}$' }
        - name: available
          in: query
          description: Seulement les notices ayant au moins un exemplaire disponible
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: "Absent = pertinence (si q) ou titre"
          schema: { type: string, enum: ['title,asc', 'publicationYear,desc'] }
      responses:
        '200':
          description: Notices visibles du public
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookSearchPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }

  /catalog/books/{id}:
    get:
      tags: [catalogue]
      summary: Fiche publique d'une notice (US-008)
      operationId: getPublicBook
      security: []
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Notice et exemplaires hors WITHDRAWN, sans donnée d'emprunteur
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookPublicDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /catalog/categories:
    get:
      tags: [catalogue]
      summary: Liste des catégories (filtres et saisie)
      operationId: listCategoryOptions
      security: []
      responses:
        '200':
          description: Toutes les catégories, triées par libellé
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CategoryOption' }

  /catalog/languages:
    get:
      tags: [catalogue]
      summary: Liste des langues
      operationId: listLanguages
      security: []
      responses:
        '200':
          description: Langues dans l'ordre d'affichage
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LanguageOption' }

  /books:
    get:
      tags: [catalogue]
      summary: Rechercher les notices (gestion, US-007 AC-007-7) — LIBRARIAN, ADMIN
      operationId: searchBooks
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/CategoryFilter'
        - name: includeWithdrawn
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema: { type: string, pattern: '^(title|publicationYear),(asc|desc)$', default: 'title,asc' }
      responses:
        '200':
          description: Page de notices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAdminPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalogue]
      summary: Créer une notice (US-009) — LIBRARIAN, ADMIN
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookRequest' }
      responses:
        '201':
          description: Notice créée (sans exemplaire)
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAdminDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /books/{id}:
    get:
      tags: [catalogue]
      summary: Fiche de gestion d'une notice (US-008 AC-008-2) — LIBRARIAN, ADMIN
      operationId: getBook
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Notice et tous ses exemplaires
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAdminDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [catalogue]
      summary: Modifier une notice (US-010) — LIBRARIAN, ADMIN
      operationId: updateBook
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookRequest' }
      responses:
        '200':
          description: Notice modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookAdminDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [catalogue]
      summary: Supprimer une notice sans exemplaire (US-011) — LIBRARIAN, ADMIN
      operationId: deleteBook
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '204': { description: Notice supprimée }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /books/{id}/copies:
    post:
      tags: [catalogue]
      summary: Ajouter des exemplaires (US-012) — LIBRARIAN, ADMIN
      operationId: addCopies
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCopiesRequest' }
      responses:
        '201':
          description: Exemplaires créés, numéros attribués (RG-09)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CopyResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /authors:
    get:
      tags: [catalogue]
      summary: Suggérer des auteurs (US-009) — LIBRARIAN, ADMIN
      operationId: suggestAuthors
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        '200':
          description: 10 auteurs au plus, triés par nom
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuthorResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalogue]
      summary: Créer un auteur (AC-009-2) — LIBRARIAN, ADMIN
      operationId: createAuthor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorRequest' }
      responses:
        '201':
          description: Auteur créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /copies/{copyNumber}:
    put:
      tags: [catalogue]
      summary: Modifier la cote et l'état d'un exemplaire (US-013) — LIBRARIAN, ADMIN
      operationId: updateCopy
      parameters:
        - $ref: '#/components/parameters/CopyNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCopyRequest' }
      responses:
        '200':
          description: Exemplaire modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /copies/{copyNumber}/withdrawal:
    post:
      tags: [catalogue]
      summary: Retirer un exemplaire du fonds (US-013, RG-10) — LIBRARIAN, ADMIN
      operationId: withdrawCopy
      parameters:
        - $ref: '#/components/parameters/CopyNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WithdrawCopyRequest' }
      responses:
        '200':
          description: Exemplaire retiré (définitif)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopyResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories:
    get:
      tags: [catalogue]
      summary: Lister les catégories avec leur nombre de notices (US-014) — LIBRARIAN, ADMIN
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema: { type: string, enum: ['label,asc', 'label,desc'], default: 'label,asc' }
      responses:
        '200':
          description: Page de catégories
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [catalogue]
      summary: Créer une catégorie (US-014) — LIBRARIAN, ADMIN
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /categories/{id}:
    put:
      tags: [catalogue]
      summary: Renommer une catégorie (US-014) — LIBRARIAN, ADMIN
      operationId: renameCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Catégorie renommée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [catalogue]
      summary: Supprimer une catégorie inutilisée (US-014, RG-12) — LIBRARIAN, ADMIN
      operationId: deleteCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204': { description: Catégorie supprimée }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: CATEGORY_IN_USE (propriété bookCount)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }

  /members:
    get:
      tags: [adherents]
      summary: "Rechercher des adhérents (US-017) — LIBRARIAN, ADMIN"
      operationId: searchMembers
      parameters:
        - name: q
          in: query
          description: "Numéro exact (A + 6 chiffres) ou nom, prénom, e-mail"
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MemberStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          description: "Tri champ,asc|desc : lastName, memberNumber, expiryDate"
          schema: { type: string }
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [adherents]
      summary: "Inscrire un adhérent et créer son compte (US-016) — LIBRARIAN, ADMIN"
      operationId: registerMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberCreateRequest' }
      responses:
        '201':
          description: Créé
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /members/to-archive:
    get:
      tags: [adherents]
      summary: "Adhérents expirés depuis plus de 3 ans (US-022, RG-19) — LIBRARIAN, ADMIN"
      operationId: membersToArchive
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberToArchivePage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members/{memberNumber}:
    get:
      tags: [adherents]
      summary: "Fiche d'un adhérent avec éligibilité (US-018) — LIBRARIAN, ADMIN"
      operationId: getMember
      parameters:
        - $ref: '#/components/parameters/MemberNumber'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [adherents]
      summary: "Modifier un adhérent (US-019) — LIBRARIAN, ADMIN"
      operationId: updateMember
      parameters:
        - $ref: '#/components/parameters/MemberNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberUpdateRequest' }
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /members/{memberNumber}/renewal:
    post:
      tags: [adherents]
      summary: "Renouveler l'adhésion (US-020, RG-15) — LIBRARIAN, ADMIN"
      operationId: renewMember
      parameters:
        - $ref: '#/components/parameters/MemberNumber'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members/{memberNumber}/suspension:
    post:
      tags: [adherents]
      summary: "Suspendre un adhérent (US-021, RG-17) — LIBRARIAN, ADMIN"
      operationId: suspendMember
      parameters:
        - $ref: '#/components/parameters/MemberNumber'
      requestBody:
