              schema: { type: array, items: { $ref: '#/components/schemas/SettingView' } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/{code}:
    put:
      tags: [pilotage]
      summary: "Modifier un paramètre (US-043, RG-40) — ADMIN"
      operationId: updateSetting
      parameters:
        - name: code
          in: path
          required: true
          schema: { $ref: '#/components/schemas/SettingCode' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingUpdateRequest' }
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /audit-entries:
    get:
      tags: [pilotage]
      summary: "Journal d'audit, lecture seule (US-044) — ADMIN"
      operationId: auditEntries
      parameters:
        - name: object
          in: query
          description: "Identifiant fonctionnel (numéro d'adhérent, d'exemplaire…)"
          schema: { type: string }
        - name: actor
          in: query
          description: "Libellé d'auteur (contient)"
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string, enum: [CREATE, UPDATE, STATE_CHANGE, DELETE, LOGIN_SUCCESS, LOGIN_FAILURE, LOGOUT] }
        - name: from
          in: query
          description: "Défaut : 6 jours avant « to »"
          schema: { type: string, format: date }
        - name: to
          in: query
          description: "Défaut : aujourd'hui"
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntryPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: BIBSESSION
      description: |
        Session serveur (ADR-004). Toute requête non sûre (POST, PUT, PATCH, DELETE) doit aussi
        envoyer l'en-tête X-XSRF-TOKEN avec la valeur du cookie XSRF-TOKEN.

  parameters:
    Page:
      name: page
      in: query
      description: Numéro de page, à partir de 0
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Taille de page
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: "Tri `champ,asc|desc` ; champs autorisés propres à chaque ressource (liste blanche)"
      schema: { type: string, pattern: '^[a-zA-Z]+,(asc|desc)$' }

    AccountId:
      name: id
      in: path
      required: true
      description: Identifiant technique du compte
      schema: { type: integer, format: int64, minimum: 1 }
    BookId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    CopyNumber:
      name: copyNumber
      in: path
      required: true
      description: Numéro d'exemplaire (RG-09)
      schema: { type: string, pattern: '^[0-9]{8}$' }
    MemberNumber:
      name: memberNumber
      in: path
      required: true
      description: Numéro d'adhérent (RG-13)
      schema: { type: string, pattern: '^A[0-9]{6}$' }
    Query:
      name: q
      in: query
      description: "Mot-clé : titre, sous-titre, auteur ou ISBN (RG-11)"
      schema: { type: string, minLength: 2, maxLength: 100 }
    CategoryFilter:
      name: categoryId
      in: query
      schema: { type: integer, format: int64 }

  responses:
    ValidationFailed:
      description: Données invalides (VALIDATION_FAILED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthenticated:
      description: Non authentifié ou session expirée (AUTHENTICATION_REQUIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Droits insuffisants (ACCESS_DENIED) ou mot de passe temporaire à changer (PASSWORD_CHANGE_REQUIRED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Ressource introuvable (<RESSOURCE>_NOT_FOUND)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflit avec l'état courant (règle de gestion, doublon, modification concurrente)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    UnprocessableEntity:
      description: Donnée refusée par une règle de gestion
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    ProblemDetail:
      type: object
      description: Erreur au format RFC 9457 (ex-RFC 7807), étendue par ADR-003
      required: [status, code]
      properties:
        type: { type: string, format: uri, default: about:blank }
        title: { type: string, examples: [Conflict] }
        status: { type: integer, examples: [409] }
        detail: { type: string, description: Message lisible en français }
        instance: { type: string }
        code: { $ref: '#/components/schemas/ErrorCode' }
        reasons:
          type: array
          description: Motifs multiples (éligibilité RG-23, blocage d'archivage RG-18)
          items: { type: string }
        fieldErrors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
      additionalProperties: true

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [title] }
        code: { type: string, examples: [NotBlank] }
        message: { type: string }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1, maximum: 100 }
        totalElements: { type: integer, format: int64, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    ErrorCode:
      type: string
      description: Codes métier stables (ARCH-socle §4)
      enum:
        - VALIDATION_FAILED
        - AUTHENTICATION_REQUIRED
        - ACCESS_DENIED
        - CSRF_TOKEN_INVALID
        - CONCURRENT_MODIFICATION
        - ROUTE_NOT_FOUND
        - REQUEST_NOT_SUPPORTED
        - INTERNAL_ERROR
        - ACCOUNT_NOT_FOUND
        - MEMBER_NOT_FOUND
        - BOOK_NOT_FOUND
        - AUTHOR_NOT_FOUND
        - CATEGORY_NOT_FOUND
        - COPY_NOT_FOUND
        - LOAN_NOT_FOUND
        - RESERVATION_NOT_FOUND
        - FINE_NOT_FOUND
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - ACCOUNT_DISABLED
        - PASSWORD_POLICY_VIOLATION
        - PASSWORD_RECENTLY_USED
        - CURRENT_PASSWORD_INCORRECT
        - PASSWORD_CHANGE_REQUIRED
        - ROLE_NOT_ALLOWED
        - SELF_DEACTIVATION_FORBIDDEN
        - LAST_ADMIN_REQUIRED
        - EMAIL_ALREADY_USED
        - ISBN_INVALID
        - ISBN_ALREADY_EXISTS
        - ISBN_LOOKUP_NOT_FOUND
        - ISBN_LOOKUP_UNAVAILABLE
        - BOOK_HAS_COPIES
        - COPY_IN_CIRCULATION
        - COPY_WITHDRAWN
        - CATEGORY_ALREADY_EXISTS
        - CATEGORY_IN_USE
        - DUPLICATE_MEMBER_SUSPECTED
        - GUARDIAN_REQUIRED
        - RENEWAL_TOO_EARLY
        - MEMBER_SUSPENDED
        - MEMBER_ARCHIVED
        - ARCHIVE_BLOCKED
        - MEMBER_NOT_ELIGIBLE
        - COPY_NOT_AVAILABLE
        - COPY_RESERVED_FOR_ANOTHER_MEMBER
        - NO_ACTIVE_LOAN_FOR_COPY
        - RENEWAL_LIMIT_REACHED
        - RENEWAL_BLOCKED_BY_RESERVATION
        - LOAN_OVERDUE
        - LOAN_NOT_ACTIVE
        - COPY_NOT_LOST
        - COPY_AVAILABLE_ON_SHELF
        - NO_COPY_IN_CIRCULATION
        - RESERVATION_LIMIT_REACHED
        - RESERVATION_ALREADY_EXISTS
        - BOOK_ALREADY_BORROWED
        - RESERVATION_CLOSED
        - PARTIAL_PAYMENT_NOT_ALLOWED
        - PAYMENT_AMOUNT_MISMATCH
        - FINE_ALREADY_SETTLED
        - SETTING_OUT_OF_RANGE
        - MONTH_IN_FUTURE

    EligibilityReason:
      type: string
      description: Motifs d'inéligibilité (RG-23), renvoyés dans ProblemDetail.reasons
      enum:
        - MEMBERSHIP_EXPIRED
        - MEMBER_SUSPENDED
        - MEMBER_ARCHIVED
        - OVERDUE_LOAN
        - UNPAID_FINES_ABOVE_THRESHOLD
        - LOAN_LIMIT_REACHED

    ArchiveBlockingReason:
      type: string
      description: Motifs de blocage de l'archivage (RG-18)
      enum: [ACTIVE_LOANS, ACTIVE_RESERVATIONS, UNPAID_FINES]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    SessionUserResponse:
      type: object
      required: [accountId, email, role, lastName, firstName, passwordTemporary]
      properties:
        accountId: { type: integer, format: int64 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        lastName: { type: string }
        firstName: { type: string }
        passwordTemporary: { type: boolean, description: "Si vrai, seul le changement de mot de passe est autorisé (RG-05)" }
        memberNumber: { type: [string, 'null'], pattern: '^A[0-9]{6}$', description: Renseigné uniquement pour le rôle MEMBER }

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { type: string, minLength: 1, maxLength: 128, description: Politique RG-01 vérifiée par le serveur }

    StaffAccountResponse:
      type: object
      required: [id, lastName, firstName, email, role, status, me, version]
      properties:
        id: { type: integer, format: int64 }
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        me: { type: boolean, description: Compte de l'administrateur connecté }
        version: { type: integer }

    StaffAccountPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/StaffAccountResponse' }

    CreateStaffAccountRequest:
      type: object
      required: [lastName, firstName, email, role, initialPassword]
      properties:
        lastName: { type: string, minLength: 1, maxLength: 100 }
        firstName: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/Role', description: LIBRARIAN ou ADMIN ; MEMBER refusé (ROLE_NOT_ALLOWED) }
        initialPassword: { type: string, minLength: 1, maxLength: 128 }

    PasswordResetRequest:
      type: object
      required: [newPassword]
      properties:
        newPassword: { type: string, minLength: 1, maxLength: 128 }

    AuthorResponse:
      type: object
      required: [id, lastName]
      properties:
        id: { type: integer, format: int64 }
        lastName: { type: string }
        firstName: { type: [string, 'null'] }

    AuthorRequest:
      type: object
      required: [lastName]
      properties:
        lastName: { type: string, minLength: 1, maxLength: 100 }
        firstName: { type: [string, 'null'], maxLength: 100 }

    CategoryOption:
      type: object
      required: [id, label]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }

    LanguageOption:
      type: object
      required: [code, label]
      properties:
        code: { type: string, pattern: '^[a-z]{3}$' }
        label: { type: string }

    BookSearchItem:
      type: object
      required: [id, title, authors, categories, availableCount, totalCount]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        authors: { type: array, items: { $ref: '#/components/schemas/AuthorResponse' } }
        publicationYear: { type: [integer, 'null'] }
        categories: { type: array, items: { $ref: '#/components/schemas/CategoryOption' } }
        availableCount: { type: integer, description: Exemplaires AVAILABLE }
        totalCount: { type: integer, description: Exemplaires hors WITHDRAWN et LOST }

    BookSearchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/BookSearchItem' } }

    PublicCopy:
      type: object
      required: [shelfMark, status]
      properties:
        shelfMark: { type: string }
        status: { $ref: '#/components/schemas/CopyStatus' }
        dueDate: { type: [string, 'null'], format: date, description: Renseignée si ON_LOAN }

    BookPublicDetail:
      type: object
      required: [id, title, authors, categories, language, copies, availableCount, totalCount]
      properties:
        id: { type: integer, format: int64 }
        isbn: { type: [string, 'null'], pattern: '^97[89][0-9]{10}$' }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        authors: { type: array, items: { $ref: '#/components/schemas/AuthorResponse' } }
        categories: { type: array, items: { $ref: '#/components/schemas/CategoryOption' } }
        publisher: { type: [string, 'null'] }
        publicationYear: { type: [integer, 'null'] }
        language: { $ref: '#/components/schemas/LanguageOption' }
        pageCount: { type: [integer, 'null'] }
        summary: { type: [string, 'null'] }
        copies: { type: array, items: { $ref: '#/components/schemas/PublicCopy' } }
        availableCount: { type: integer }
        totalCount: { type: integer }

    BookAdminItem:
      type: object
      required: [id, title, authors, availableCount, totalCount, copyCount, withdrawn]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        authors: { type: array, items: { $ref: '#/components/schemas/AuthorResponse' } }
        isbn: { type: [string, 'null'] }
        publicationYear: { type: [integer, 'null'] }
        availableCount: { type: integer }
        totalCount: { type: integer }
        copyCount: { type: integer, description: "Tous les exemplaires, y compris retirés" }
        withdrawn: { type: boolean, description: Au moins un exemplaire et tous retirés }

    BookAdminPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/BookAdminItem' } }

    CopyResponse:
      type: object
      required: [id, copyNumber, shelfMark, physicalCondition, acquisitionDate, status, version]
      properties:
        id: { type: integer, format: int64 }
        copyNumber: { type: string, pattern: '^[0-9]{8}$' }
        shelfMark: { type: string }
        physicalCondition: { $ref: '#/components/schemas/PhysicalCondition' }
        acquisitionDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/CopyStatus' }
        withdrawalReason: { oneOf: [{ $ref: '#/components/schemas/WithdrawalReason' }, { type: 'null' }] }
        dueDate: { type: [string, 'null'], format: date }
        version: { type: integer }

    BookAdminDetail:
      type: object
      required: [id, title, authors, categories, language, copies, availableCount, totalCount, version]
      properties:
        id: { type: integer, format: int64 }
        isbn: { type: [string, 'null'] }
        title: { type: string }
        subtitle: { type: [string, 'null'] }
        authors: { type: array, items: { $ref: '#/components/schemas/AuthorResponse' } }
        categories: { type: array, items: { $ref: '#/components/schemas/CategoryOption' } }
        publisher: { type: [string, 'null'] }
        publicationYear: { type: [integer, 'null'] }
        language: { $ref: '#/components/schemas/LanguageOption' }
        pageCount: { type: [integer, 'null'] }
        summary: { type: [string, 'null'] }
        copies: { type: array, items: { $ref: '#/components/schemas/CopyResponse' } }
        availableCount: { type: integer }
        totalCount: { type: integer }
        version: { type: integer }

    BookRequest:
      type: object
      required: [title, authorIds, categoryIds, languageCode]
      properties:
        isbn: { type: [string, 'null'], maxLength: 20, description: "ISBN-10 ou ISBN-13, tirets et espaces tolérés (RG-07)" }
        title: { type: string, minLength: 1, maxLength: 255 }
        subtitle: { type: [string, 'null'], maxLength: 255 }
        authorIds: { type: array, minItems: 1, items: { type: integer, format: int64 }, description: Ordre d'affichage }
        categoryIds: { type: array, minItems: 1, uniqueItems: true, items: { type: integer, format: int64 } }
        publisher: { type: [string, 'null'], maxLength: 150 }
        publicationYear: { type: [integer, 'null'], minimum: 1450, description: "≤ année en cours (RG-08)" }
        languageCode: { type: string, pattern: '^[a-z]{3}$' }
        pageCount: { type: [integer, 'null'], minimum: 1 }
        summary: { type: [string, 'null'], maxLength: 4000 }
        version: { type: [integer, 'null'], description: Obligatoire en modification }

    AddCopiesRequest:
      type: object
      required: [quantity, shelfMark, physicalCondition, acquisitionDate]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 20 }
        shelfMark: { type: string, minLength: 1, maxLength: 30 }
        physicalCondition: { $ref: '#/components/schemas/PhysicalCondition' }
        acquisitionDate: { type: string, format: date, description: "≤ date du jour" }

    UpdateCopyRequest:
      type: object
      required: [shelfMark, physicalCondition, version]
      properties:
        shelfMark: { type: string, minLength: 1, maxLength: 30 }
        physicalCondition: { $ref: '#/components/schemas/PhysicalCondition' }
        version: { type: integer }

    WithdrawCopyRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/WithdrawalReason' }

    CategoryResponse:
      type: object
      required: [id, label, bookCount, version]
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        bookCount: { type: integer }
        version: { type: integer }

    CategoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [content]
          properties:
            content: { type: array, items: { $ref: '#/components/schemas/CategoryResponse' } }

    CategoryRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 2, maxLength: 50 }
        version: { type: [integer, 'null'], description: Obligatoire en modification }

    SettingCode:
      type: string
      enum: [MEMBERSHIP_DURATION_MONTHS, MEMBERSHIP_EARLY_RENEWAL_DAYS, LOAN_DURATION_DAYS, LOAN_MAX_ACTIVE, LOAN_MAX_RENEWALS, LOAN_RENEWAL_DAYS, RESERVATION_MAX_ACTIVE, RESERVATION_PICKUP_DAYS, FINE_BLOCKING_THRESHOLD, FINE_DAILY_RATE, FINE_LATE_CAP, FINE_LOST_ITEM_AMOUNT]

    GuardianRequest:
      type: object
      required: [lastName, firstName, phone]
      properties:
        lastName: { type: string }
        firstName: { type: string }
        phone: { type: string }

    MemberCreateRequest:
      type: object
      required: [lastName, firstName, birthDate, email, street, postalCode, city, password]
      properties:
        lastName: { type: string, maxLength: 100 }
        firstName: { type: string, maxLength: 100 }
        birthDate: { type: string, format: date }
        guardian: { $ref: '#/components/schemas/GuardianRequest' }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, description: 'Q-24 : 0 + 9 chiffres, ou + et 8 à 15 chiffres ; espaces tolérés' }
        street: { type: string, maxLength: 255 }
        postalCode: { type: string, pattern: '^[0-9]{5}$' }
        city: { type: string, maxLength: 100 }
        password: { type: string, description: 'Mot de passe initial (RG-01), temporaire (RG-05)' }
        confirmDuplicate: { type: boolean, default: false, description: 'AC-016-7' }

    MemberUpdateRequest:
      type: object
      required: [lastName, firstName, birthDate, email, street, postalCode, city, version]
      properties:
        lastName: { type: string }
        firstName: { type: string }
        birthDate: { type: string, format: date }
        guardian: { $ref: '#/components/schemas/GuardianRequest' }
        email: { type: string }
        phone: { type: string }
        street: { type: string }
        postalCode: { type: string }
        city: { type: string }
        version: { type: integer }

    SuspendMemberRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 255 }

    ContactRequest:
      type: object
      required: [street, postalCode, city, version]
      properties:
        phone: { type: string }
        street: { type: string }
        postalCode: { type: string, pattern: '^[0-9]{5}$' }
        city: { type: string }
        version: { type: integer }

    MemberSummary:
      type: object
      required: [memberNumber, status, expiryDate]
      properties:
        memberNumber: { type: string }
        lastName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        status: { $ref: '#/components/schemas/MemberStatus' }
        expiryDate: { type: string, format: date }

    Eligibility:
      type: object
      required: [eligible, reasons, activeLoans, loanLimit, remainingLoans, unpaidTotal, fineThreshold]
      properties:
        eligible: { type: boolean }
        reasons: { type: array, items: { $ref: '#/components/schemas/EligibilityReason' } }
        activeLoans: { type: integer }
        loanLimit: { type: integer }
        remainingLoans: { type: integer }
        unpaidTotal: { type: number, description: 'Montant en euros, 2 décimales' }
        fineThreshold: { type: number, description: 'Montant en euros, 2 décimales' }

    RenewalInfo:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        newExpiryDate: { type: [string, 'null'], format: date }
        renewableFrom: { type: [string, 'null'], format: date }
        blockedBy: { type: [string, 'null'], enum: [RENEWAL_TOO_EARLY, MEMBER_SUSPENDED, MEMBER_ARCHIVED, null] }

    Guardian:
      type: object
      required: [lastName, firstName, phone]
      properties:
        lastName: { type: string }
        firstName: { type: string }
        phone: { type: string }

    MemberDetail:
      type: object
      required: [memberNumber, postalCode, registrationDate, expiryDate, status, version, eligibility, renewal, expiresSoon, activeReservations]
      properties:
        memberNumber: { type: string }
        lastName: { type: [string, 'null'] }
        firstName: { type: [string, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        street: { type: [string, 'null'] }
        postalCode: { type: string }
        city: { type: [string, 'null'] }
        guardian: { $ref: '#/components/schemas/Guardian' }
        registrationDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/MemberStatus' }
        suspensionReason: { type: [string, 'null'] }
        accountId: { type: [integer, 'null'], format: int64 }
        accountStatus: { $ref: '#/components/schemas/AccountStatus' }
